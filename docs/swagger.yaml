host: localhost:9090
info:
  contact: {}
  description: 회원/상품/주문 API — clean architecture, stdlib net/http.
  title: Shop API
  version: "1.0"
paths:
  /items:
    get:
      description: 카테고리·가격범위 필터와 날짜/가격 정렬을 지원한다. 정렬 키는 화이트리스트로 제한된다.
      parameters:
      - description: 카테고리 ID
        in: query
        name: categoryId
        type: integer
      - description: 최소 가격
        in: query
        name: minPrice
        type: integer
      - description: 최대 가격
        in: query
        name: maxPrice
        type: integer
      - description: 정렬
        enum:
        - newest
        - oldest
        - price_asc
        - price_desc
        in: query
        name: sort
        type: string
      - description: 페이지 크기 (기본 20, 최대 100)
        in: query
        name: limit
        type: integer
      - description: 오프셋 (기본 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_rest.Envelope-array_github_com_shseooo_go-architecture_app_domain_Item'
      summary: 상품 검색 (동적 쿼리)
      tags:
      - items
    post:
      consumes:
      - application/json
      parameters:
      - description: '상품 정보 (type: BOOK|ALBUM|MOVIE)'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/app_rest.itemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/app_rest.Envelope-github_com_shseooo_go-architecture_app_domain_Item'
        "400":
          description: 입력 검증 실패
          schema:
            $ref: '#/definitions/app_rest.ErrorEnvelope'
        "500":
          description: 서버 에러
          schema:
            $ref: '#/definitions/app_rest.ErrorEnvelope'
      summary: 상품 등록
      tags:
      - items
  /items/{id}:
    get:
      parameters:
      - description: 상품 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_rest.Envelope-github_com_shseooo_go-architecture_app_domain_Item'
        "404":
          description: 상품 없음
          schema:
            $ref: '#/definitions/app_rest.ErrorEnvelope'
      summary: 상품 조회
      tags:
      - items
    put:
      consumes:
      - application/json
      parameters:
      - description: 상품 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 상품 정보
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/app_rest.itemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_rest.Envelope-github_com_shseooo_go-architecture_app_domain_Item'
        "400":
          description: 입력 검증 실패
          schema:
            $ref: '#/definitions/app_rest.ErrorEnvelope'
        "404":
          description: 상품 없음
          schema:
            $ref: '#/definitions/app_rest.ErrorEnvelope'
      summary: 상품 수정
      tags:
      - items
  /members:
    post:
      consumes:
      - application/json
      parameters:
      - description: 회원 정보
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/app_rest.memberRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/app_rest.Envelope-github_com_shseooo_go-architecture_app_domain_Member'
        "400":
          description: 입력 검증 실패
          schema:
            $ref: '#/definitions/app_rest.ErrorEnvelope'
        "500":
          description: 서버 에러
          schema:
            $ref: '#/definitions/app_rest.ErrorEnvelope'
      summary: 회원 등록
      tags:
      - members
  /members/{id}:
    get:
      parameters:
      - description: 회원 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_rest.Envelope-github_com_shseooo_go-architecture_app_domain_Member'
        "400":
          description: 잘못된 ID
          schema:
            $ref: '#/definitions/app_rest.ErrorEnvelope'
        "404":
          description: 회원 없음
          schema:
            $ref: '#/definitions/app_rest.ErrorEnvelope'
      summary: 회원 조회
      tags:
      - members
  /members/{id}/orders:
    get:
      description: 회원의 주문 목록을 조회한다. 주문 항목·배송은 배치 로딩으로 N+1 없이 함께 반환된다.
      parameters:
      - description: 회원 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_rest.Envelope-array_github_com_shseooo_go-architecture_app_domain_Order'
        "400":
          description: 잘못된 ID
          schema:
            $ref: '#/definitions/app_rest.ErrorEnvelope'
      summary: 주문 내역 조회
      tags:
      - orders
  /orders:
    post:
      consumes:
      - application/json
      description: 재고를 확인·차감하고 배송 정보와 함께 주문을 생성한다 (단일 트랜잭션).
      parameters:
      - description: 주문 정보
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/app_rest.orderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/app_rest.Envelope-github_com_shseooo_go-architecture_app_domain_Order'
        "400":
          description: 입력 검증 실패
          schema:
            $ref: '#/definitions/app_rest.ErrorEnvelope'
        "404":
          description: 회원/상품 없음
          schema:
            $ref: '#/definitions/app_rest.ErrorEnvelope'
        "409":
          description: 재고 부족
          schema:
            $ref: '#/definitions/app_rest.ErrorEnvelope'
      summary: 상품 주문
      tags:
      - orders
  /orders/{id}/cancel:
    post:
      description: 주문을 취소하고 각 상품의 재고를 복원한다 (단일 트랜잭션).
      parameters:
      - description: 주문 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: 취소 완료
        "404":
          description: 주문 없음
          schema:
            $ref: '#/definitions/app_rest.ErrorEnvelope'
        "409":
          description: 이미 취소된 주문
          schema:
            $ref: '#/definitions/app_rest.ErrorEnvelope'
      summary: 주문 취소
      tags:
      - orders
swagger: "2.0"
