basePath: /
definitions:
  github_com_shseooo_go-architecture_internal_catalog_internal_domain.ItemType:
    enum:
    - BOOK
    - ALBUM
    - MOVIE
    type: string
    x-enum-varnames:
    - ItemTypeBook
    - ItemTypeAlbum
    - ItemTypeMovie
  github_com_shseooo_go-architecture_internal_shared.Address:
    properties:
      city:
        type: string
      street:
        type: string
      zipcode:
        type: string
    type: object
  internal_catalog_internal_rest.itemRequest:
    properties:
      actor:
        type: string
      artist:
        type: string
      author:
        type: string
      category_ids:
        items:
          type: integer
        type: array
      director:
        type: string
      etc:
        type: string
      isbn:
        type: string
      name:
        type: string
      price:
        type: integer
      stock_quantity:
        type: integer
      type:
        $ref: '#/definitions/github_com_shseooo_go-architecture_internal_catalog_internal_domain.ItemType'
    type: object
  internal_customer_internal_rest.memberRequest:
    properties:
      address:
        $ref: '#/definitions/github_com_shseooo_go-architecture_internal_shared.Address'
      name:
        type: string
    type: object
  internal_ordering_internal_rest.orderRequest:
    properties:
      address:
        $ref: '#/definitions/github_com_shseooo_go-architecture_internal_shared.Address'
      lines:
        items:
          properties:
            count:
              type: integer
            item_id:
              type: integer
          type: object
        type: array
      member_id:
        type: integer
    type: object
host: localhost:9090
info:
  contact: {}
  description: 회원/상품/주문 API — modular monolith, stdlib net/http, sqlc.
  title: Shop API
  version: "1.0"
paths:
  /items:
    get:
      parameters:
      - description: 카테고리 ID
        in: query
        name: categoryId
        type: integer
      - description: 최소 가격
        in: query
        name: minPrice
        type: integer
      - description: 최대 가격
        in: query
        name: maxPrice
        type: integer
      - description: 정렬
        enum:
        - newest
        - oldest
        - price_asc
        - price_desc
        in: query
        name: sort
        type: string
      - description: 페이지 크기 (기본 20, 최대 100)
        in: query
        name: limit
        type: integer
      - description: 오프셋
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
      summary: 상품 검색 (동적 쿼리 + 페이징)
      tags:
      - items
    post:
      consumes:
      - application/json
      parameters:
      - description: '상품 정보 (type: BOOK|ALBUM|MOVIE)'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_catalog_internal_rest.itemRequest'
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
      summary: 상품 등록
      tags:
      - items
  /items/{id}:
    get:
      parameters:
      - description: 상품 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
      summary: 상품 조회
      tags:
      - items
    put:
      parameters:
      - description: 상품 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 상품 정보
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_catalog_internal_rest.itemRequest'
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
      summary: 상품 수정
      tags:
      - items
  /members:
    post:
      consumes:
      - application/json
      parameters:
      - description: 회원 정보
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_customer_internal_rest.memberRequest'
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
      summary: 회원 등록
      tags:
      - members
  /members/{id}:
    get:
      parameters:
      - description: 회원 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
      summary: 회원 조회
      tags:
      - members
  /members/{id}/orders:
    get:
      parameters:
      - description: 회원 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
      summary: 주문 내역 조회
      tags:
      - orders
  /orders:
    post:
      consumes:
      - application/json
      parameters:
      - description: 주문 정보
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_ordering_internal_rest.orderRequest'
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "409":
          description: Conflict
      summary: 상품 주문
      tags:
      - orders
  /orders/{id}/cancel:
    post:
      parameters:
      - description: 주문 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
        "409":
          description: Conflict
      summary: 주문 취소
      tags:
      - orders
swagger: "2.0"
